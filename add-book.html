<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>

<body>

    <nav class="navbar bg-dark border-bottom border-body navbar-expand-lg" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html"><img src="./img 3/duck.png" width="50" alt=""></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active text-light" aria-current="page" href="#">Catalogo Libri</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-secondary" href="#">Anagrafica Utenti</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link text-secondary" href="#">Storico Prestiti</a>

                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Action</a></li>
                            <li><a class="dropdown-item" href="#">Another action</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="#">Something else here</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-secondary" href="#">Help</a>
                    </li>
                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
                    <button class="btn btn-outline-success text-light border-light" type="submit">Cerca</button>
                </form>
            </div>
        </div>
    </nav>
    <div class="container">
        <div class="row">

            <!--Title-->
            <div class="col-12 mt-2">
                <h1>Nuovo Libro</h1>
            </div>

            <!--Name&surname-->

            <form class="row">
                <div class="col-6 mb-3">
                    <label for="author-name" class="form-label">Nome Autore</label>
                    <input type="text" class="form-control" id="name" placeholder="Inserisci il nome dell'autore">
                </div>
                <div class="col-6 mb-3">
                    <label for="author-surname" class="form-label">Cognome Autore</label>
                    <input type="text" class="form-control" id="name" placeholder="Inserisci il cognome dell'autore">
                </div>
                <div class="col-12 mb-3">
                    <label for="book-title" class="form-label">Titolo</label>
                    <input type="text" class="form-control" id="name" placeholder="Inserisci il titolo del libro">
                    <div id="titleHelp" class="form-text">Titolo versione Italiana.</div>
                </div>
            </form>
        </div>

        <!--type year and code-->
        <div class="row">
            <form class="row">
                <div class="col-12 col-lg-4 mb-3">
                    <label for="genre" class="form-label">Genere</label>
                    <select id="book-genre" class="form-select">
                        <option>Scegli il genere</option>
                    </select>
                </div>
                <div class="col-12 col-lg-4 mb-3">
                    <label for="author-surname" class="form-label">Anno di Pubblicazione</label>
                    <input type="text" class="form-control" id="name" placeholder="Inserisci l'anno">
                </div>
                <div class="col-12 col-lg-4 mb-3">
                    <label for="book-title" class="form-label">ISBN#</label>
                    <input type="text" class="form-control" id="name" placeholder="Inserisci il codice ISBN#">
                </div>
            </form>
        </div>
        <!--Note-->
        <div class="col">

        </div>

        <!--digital version book-->
        <div class="col">

        </div>

        <!--add book-->
        <div class="col"></div>


    </div>

    </div>














    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"

</html>
